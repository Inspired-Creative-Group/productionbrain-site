<title>Production Brain Hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#EFE9DE; --faint:#9A9186;
    --brass:#E0B978; --line:#A3937D;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#0B0907;color:var(--ink);font-family:var(--mono)}

  .hero{position:relative;width:100%;aspect-ratio:2/1;overflow:hidden;background:#14110E}
  .hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .hero svg.wires,.hero .labels{position:absolute;inset:0;width:100%;height:100%}
  .labels{pointer-events:none}

  /* GROUP TITLE — Juan: bigger */
  .grp{position:absolute;font-size:clamp(16px,1.98vw,33px);font-weight:600;letter-spacing:.14em;
       text-transform:uppercase;color:var(--brass);white-space:nowrap;
       text-shadow:0 1px 10px rgba(0,0,0,.9)}
  .grp.l{text-align:right;transform:translateX(-100%)}

  /* a row: logo marks + the category name */
  .row{position:absolute;display:flex;align-items:center;gap:.62em;white-space:nowrap;
       transform:translateY(-50%);font-size:clamp(13px,1.53vw,24px)}
  .row.l{transform:translate(-100%,-50%);flex-direction:column;align-items:flex-end;gap:.3em}
  .row .nm{color:var(--ink);letter-spacing:.02em;text-shadow:0 1px 8px rgba(0,0,0,.95)}
  .marks{display:flex;align-items:center;gap:.5em}
  .marks svg{width:1.5em;height:1.5em;fill:var(--faint);
             filter:drop-shadow(0 1px 5px rgba(0,0,0,.9))}
  .row.two .marks svg{fill:var(--brass)}
  .row.two .nm{color:#fff}

  /* The viewBox is 3600 wide and renders at ~1440, so a stroke-width of 1.7 was being
     scaled down to about 0.68 of a real pixel. That, not the colour, is why the wires
     disappeared. non-scaling-stroke pins the width to screen pixels at any size. */
  .wires{filter:drop-shadow(0 1px 3px rgba(0,0,0,.95))}
  .wire{fill:none;stroke:var(--line);stroke-width:2.4;vector-effect:non-scaling-stroke;
        stroke-linecap:round;stroke-linejoin:round}
  .wire.two{stroke:var(--brass);stroke-width:2.6}
  .wire.thin{stroke-width:1.8;stroke-opacity:.8}
  .dot{fill:var(--line)}
  .dot.two{fill:var(--brass)}
</style>

<div class="hero">
  <img src="assets/hero-machine-wide.jpg" alt="The Production Brain, a compact machine on a studio desk">

  <svg class="wires" viewBox="0 0 3600 1800" preserveAspectRatio="none" aria-hidden="true">
    <!-- IN: six sources, one way, stopping at the machine's left edge -->
    <g class="wire">
      <path d="M 790 340  H 830 Q 880 340 880 390 V 980 H 935"/>
      <path d="M 790 500  H 850 Q 900 500 900 550 V 1000 H 935"/>
      <path d="M 790 660  H 870 Q 920 660 920 710 V 1020 H 935"/>
      <path d="M 790 1260 H 870 Q 920 1260 920 1210 V 1110 H 935"/>
      <path d="M 790 1420 H 850 Q 900 1420 900 1370 V 1130 H 935"/>
      <path d="M 790 1580 H 830 Q 880 1580 880 1530 V 1150 H 935"/>
    </g>
    <g class="dot">
      <circle cx="935" cy="980" r="9"/><circle cx="935" cy="1000" r="9"/>
      <circle cx="935" cy="1020" r="9"/><circle cx="935" cy="1110" r="9"/>
      <circle cx="935" cy="1130" r="9"/><circle cx="935" cy="1150" r="9"/>
    </g>

    <!-- OUT: the agents, two way -->
    <g class="wire two">
      <path d="M 2260 1005 H 2440 Q 2540 1005 2540 905 V 430  H 2890"/>
      <path d="M 2260 1025 H 2500 Q 2590 1025 2590 955 V 660  H 2890"/>
      <path d="M 2260 1045 H 2560 Q 2640 1045 2640 995 V 890  H 2890"/>
      <path d="M 2260 1075 H 2500 Q 2590 1075 2590 1125 V 1220 H 2890"/>
    </g>
    <g class="dot two">
      <circle cx="2260" cy="1005" r="9"/><circle cx="2260" cy="1025" r="9"/>
      <circle cx="2260" cy="1045" r="9"/><circle cx="2260" cy="1075" r="9"/>
    </g>

    <!-- Juan's correction: the laptops hang off the AGENTS, not off the machine.
         One trunk drops from the agent column and fans to the laptops. -->
    <g class="wire two thin">
      <path d="M 3330 500  V 1490"/>
      <path d="M 3330 730  V 1490"/>
      <path d="M 3330 960  V 1490"/>
      <path d="M 3330 1290 V 1490"/>
    </g>
    <g class="wire thin">
      <path d="M 3330 1490 H 3120"/>
    </g>
    <circle class="dot two" cx="3330" cy="1490" r="10"/>
    <circle class="dot" cx="3120" cy="1490" r="9"/>
  </svg>

  <div class="labels">
    <div class="grp l" style="left:20.5%;top:7.5%">What feeds it</div>
    <div class="row l" style="left:20.5%;top:17.0%"><span class="nm">Documents and notes</span>
      <span class="marks"><svg><use href="#i-notion"/></svg><svg><use href="#i-googledocs"/></svg></span></div>
    <div class="row l" style="left:20.5%;top:28.0%"><span class="nm">Files</span>
      <span class="marks"><svg><use href="#i-googledrive"/></svg><svg><use href="#i-dropbox"/></svg><svg><use href="#i-microsoftonedrive"/></svg></span></div>
    <div class="row l" style="left:20.5%;top:39.0%"><span class="nm">Chat and email</span>
      <span class="marks"><svg><use href="#i-slack"/></svg><svg><use href="#i-microsoftteams"/></svg><svg><use href="#i-gmail"/></svg></span></div>
    <div class="row l" style="left:20.5%;top:68.0%"><span class="nm">Meetings</span>
      <span class="marks"><svg><use href="#i-googlemeet"/></svg><svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 3.5V7l-4 3.5z"/></svg></span></div>
    <div class="row l" style="left:20.5%;top:79.0%"><span class="nm">Project tracker</span>
      <span class="marks"><svg><use href="#i-clickup"/></svg><svg><use href="#i-linear"/></svg><svg><use href="#i-jira"/></svg></span></div>
    <div class="row l" style="left:20.5%;top:90.0%"><span class="nm">Your own folder</span>
      <span class="marks"><svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 014.5 5h4.2l1.8 2h9A1.5 1.5 0 0121 8.5v10a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 18.5v-12z"/></svg></span></div>

    <div class="grp" style="left:80.3%;top:16.0%">What asks and adds</div>
    <div class="row two" style="left:80.3%;top:23.9%"><span class="marks"><svg><use href="#i-claude"/></svg></span><span class="nm">Claude Code</span></div>
    <div class="row two" style="left:80.3%;top:36.7%"><span class="marks"><svg><use href="#i-openai"/></svg></span><span class="nm">Codex</span></div>
    <div class="row two" style="left:80.3%;top:49.4%"><span class="marks"><svg><use href="#i-cursor"/></svg></span><span class="nm">Cursor</span></div>
    <div class="row two" style="left:80.3%;top:67.8%"><span class="marks"><svg><use href="#i-claude"/></svg></span><span class="nm">claude.ai</span></div>

    <div class="grp l" style="left:86.0%;top:76.5%;font-size:clamp(13px,1.38vw,21px);letter-spacing:.18em;color:var(--faint)">Through the agents</div>
    <div class="row l" style="left:86.0%;top:82.8%"><span class="nm">Your editors' laptops</span></div>
  </div>
</div>

<script>
  // inline the sprite so <use href="#i-..."> resolves
  fetch('assets/logos.svg').then(r=>r.text()).then(t=>{
    document.body.insertAdjacentHTML('afterbegin', t);
  });
</script>
